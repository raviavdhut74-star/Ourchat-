<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Our Chat ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    ❤️ Our Chat <span id="streak"></span>
    <div id="sub"></div>
    <div class="hbtns">
      <button id="voiceBtn">📞</button>
      <button id="videoBtn">🎥</button>
      <button id="heartBtn" title="Miss you">❤️</button>
      <button id="darkBtn" title="Dark mode">🌙</button>
      <button id="deleteAllBtn" title="Delete all my messages">🗑️</button>
      <button id="logoutBtn">🚪</button>
    </div>
  </div>

  <div id="storyBar">
    <div class="sItem" id="snapBtn"><div class="sCircle">📸</div><span>Snap</span></div>
    <div class="sItem" id="addStory"><div class="sCircle">➕</div><span>Story</span></div>
    <div id="storyList"></div>
  </div>

  <div class="chat" id="chat"><div id="status">Connecting...</div></div>

  <div class="inputArea">
    <button id="attachBtn" title="Photo / Video / File">📎</button>
    <button id="micBtn" title="Voice message">🎤</button>
    <input type="file" id="fileInput" hidden>
    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

  <input type="file" id="snapInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="storyInput" accept="image/*" hidden>
  <div id="viewer" class="overlay" hidden>
    <img id="viewImg" alt="">
    <div id="viewTop"></div>
    <button id="viewDel" hidden>🗑️</button>
  </div>

  <div id="replyBar" hidden><span id="replyText"></span><button id="replyX">✕</button></div>

  <div id="callUI" class="overlay" hidden>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="callInfo"></div>
    <div class="callBtns"><button id="muteBtn">🎤</button><button id="endBtn">📵</button></div>
  </div>

  <div id="incoming" class="overlay" hidden>
    <div id="incomingText"></div>
    <div class="callBtns"><button id="acceptBtn">✅</button><button id="declineBtn">❌</button></div>
  </div>

  <div id="loginBox" class="overlay">
    <div class="loginCard">
      <div class="loginTitle">❤️ Our Chat</div>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <div id="loginErr"></div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
