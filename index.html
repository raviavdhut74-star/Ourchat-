<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
  <meta charset="UTF-8">
  <title>Jivlag</title>
  <meta name="theme-color" content="#f6f4fa">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1791500298">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.7" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21.4 11.6l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-busy" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M12 2.5c-4 0-6.5 3-6.5 7v8c0 .8.9 1.1 1.4.6l1.4-1.4a1 1 0 0 1 1.4 0l1.2 1.2a1 1 0 0 0 1.4 0l1.2-1.2a1 1 0 0 1 1.4 0l1.4 1.4c.5.5 1.4.2 1.4-.6v-8c0-4-2.5-7-6.5-7z"/><circle cx="9.5" cy="10" r="1.1" fill="#111" stroke="none"/><circle cx="14.5" cy="10" r="1.1" fill="#111" stroke="none"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><polygon points="10 8.5 16 12 10 15.5 10 8.5" fill="currentColor"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 16l-5-5-8 8"/></symbol>
  </svg>

  <div id="home">
    <div class="header igHead">
      <div class="logoT">Jivlag</div>
      <div class="hactions"><button id="topChats" class="ib"><svg class="ic"><use href="#i-send"/></svg></button><button id="menuBtn" class="ib"><svg class="ic"><use href="#i-more"/></svg></button></div>
      <div id="menu" hidden>
        <button id="notifBtn">📲 Push alerts</button>
        <button id="heartBtn" style="display:none">❤️</button>
        <button id="galMenu">🖼️ Gallery</button>
        <button id="darkBtn">🌙 Dark mode</button>
        <button id="deleteAllBtn">🗑️ Delete my messages</button>
        <button id="clearAllBtn" style="display:none">x</button>
        <button id="actMenu">🔔 Activity</button>
        <button id="reqMenu">👥 Follow requests</button>
        <button id="privBtn">🔒 Private account: Off</button>
        <button id="cfMenu">💚 Close friends</button>
        <button id="audBtn">📖 Story for: Everyone</button>
        <button id="limMenu">🔕 Muted & restricted</button>
        <button id="savedMenu">🔖 Saved</button>
        <button id="histMenu">🕘 History</button>
        <button id="blockMenu">🚫 Blocked accounts</button>
        <button id="logoutBtn">🚪 Logout</button>
      </div>
    </div>
    <div id="storyBar">
      <span id="snapBtn" hidden></span>
      <div class="sItem" id="addStory"><div class="sCircle add"><svg class="ic"><use href="#i-plus"/></svg></div><span>Your story</span></div>
      <div id="storyList"></div>
    </div>
    <div id="postFeed"></div>
  </div>
  <div id="chats" hidden><div class="ctitle">Chats</div><input id="userSearch" class="uSearch" placeholder="🔍 Search users" autocomplete="off" autocapitalize="none"><div id="chatList"></div><div class="ctitle">Calls</div><div id="callLog"></div></div>
  <div id="prof" hidden>
    <div class="header igHead"><button id="profBack" class="ib" hidden>←</button><div class="logoT" id="profUser"></div><span class="verTag">build 68311</span></div>
    <div class="pTop"><div class="bigAv" id="profAv"></div>
      <div class="pStats"><div><b id="stPosts">0</b>Posts</div><div><b id="stFollowers">0</b>Followers</div><div><b id="stFollowing">0</b>Following</div></div></div>
    <div class="pInfo"><b id="profNameShow"></b><div id="profBioShow"></div></div>
    <div class="pBtns"><button id="profEdit">Edit profile</button><button id="profPhotoBtn">Change photo</button><button id="profFollow" hidden>Follow</button><button id="profMsg" hidden>Message</button><button id="profBlock" hidden>Block</button><button id="profMore" hidden>⋯</button></div>
    <input type="file" id="profPhoto" accept="image/*" hidden>
    <div id="profForm" hidden><input id="profName" placeholder="Name" maxlength="30"><input id="profBio" placeholder="Bio" maxlength="80"><button id="profSave" class="saveBtn">Save</button></div>
    <div class="pTabs"><button id="tabPosts" class="on">▦ Posts</button><button id="tabReels">🎬 Reels</button></div>
    <div class="pGrid" id="profGrid"></div>
  </div>

  <div id="chatScreen" hidden>
  <div class="header">
    <button id="chatBack" class="ib">←</button>
    <div class="avatar" id="peerAv">?</div>
    <div class="hinfo"><div class="htitle"><span id="peerName"></span> <span id="streak"></span></div><div id="sub"></div></div>
    <div class="hactions">
      <button id="searchBtn" class="ib"><svg class="ic"><use href="#i-search"/></svg></button>
      <button id="voiceBtn" class="ib"><svg class="ic"><use href="#i-phone"/></svg></button>
      <button id="videoBtn" class="ib"><svg class="ic"><use href="#i-video"/></svg></button>
    </div>
  </div>

  <div id="searchBar" hidden>
    <input id="searchInput" type="search" placeholder="Search messages…" autocomplete="off">
    <span id="searchCount"></span>
    <button id="searchClose" title="Close">✕</button>
  </div>


  <div id="pinBar" hidden>
    <span>📌</span><span id="pinText"></span><button id="pinX" title="Unpin">✕</button>
  </div>

  <div class="chat" id="chat"><div id="status">Connecting...</div></div>

  <div class="inputArea">
    <div class="pill">
      <input type="text" id="messageInput" placeholder="Message" autocomplete="off">
      <button id="attachBtn" title="Attach"><svg class="ic"><use href="#i-clip"/></svg></button>
      <button id="camBtn" title="Snap"><svg class="ic"><use href="#i-camera"/></svg></button>
    </div>
    <input type="file" id="fileInput" hidden>
    <button id="micBtn" title="Voice message"><svg class="ic"><use href="#i-mic"/></svg></button>
    <button id="sendBtn" title="Send"><svg class="ic"><use href="#i-send"/></svg></button>
  </div>

  </div>

  <span id="galBtn" hidden></span>
  <nav id="nav">
    <button id="navChat" class="on"><i><svg class="ic"><use href="#i-grid"/></svg></i>Home</button>
    <button id="reelsBtn"><i><svg class="ic"><use href="#i-film"/></svg></i>Reels</button>
    <button id="postsBtn"><i><svg class="ic"><use href="#i-plus"/></svg></i>Post</button>
    <button id="navChats"><i><svg class="ic"><use href="#i-chat"/></svg></i>Chats</button>
    <button id="navProf"><i><svg class="ic"><use href="#i-ghost"/></svg></i>Profile</button>
  </nav>

  <input type="file" id="snapInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="storyInput" accept="image/*,video/*" hidden>
  <div id="viewer" class="overlay" hidden>
    <img id="viewImg" alt=""><video id="viewVid" playsinline controls hidden></video>
    <div id="viewTop"></div>
    <button id="viewDel" hidden>🗑️</button>
  </div>

  <div id="reels" class="overlay" hidden>
    <div id="reelTop">
      <button id="reelBack" class="rb">←</button>
      <span>Reels</span>
      <button id="reelAdd" class="rb"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
    <div id="reelFeed"></div>
    <input type="file" id="reelInput" accept="video/*" hidden>
  </div>

  <div id="gallery" class="overlay" hidden>
    <div id="galTop">
      <button id="galBack" class="rb">←</button>
      <span>Gallery</span>
      <span style="width:40px"></span>
    </div>
    <div id="galTabs">
      <button data-f="all" class="on">All</button>
      <button data-f="image">Photos</button>
      <button data-f="video">Videos</button>
    </div>
    <div id="galFeed"></div>
  </div>

  <input type="file" id="postInput" accept="image/*,video/*" hidden>

  <div id="cmSheet" hidden>
    <div id="cmHead"><b>Comments</b><button id="cmClose">✕</button></div>
    <div id="cmList"></div>
    <div id="cmForm">
      <input id="cmInput" placeholder="Write a comment…" autocomplete="off">
      <button id="cmSend"><svg class="ic"><use href="#i-send"/></svg></button>
    </div>
  </div>
  <div id="msgMenu" hidden>
    <div id="mmSheet">
      <button id="mmReply">↩️ Reply</button>
      <button id="mmCopy">📋 Copy</button>
      <button id="mmForward">➤ Forward</button>
      <button id="mmPin">📌 Pin</button>
      <button id="mmEdit">✏️ Edit</button>
      <button id="mmDelete">🗑️ Delete</button>
      <button id="mmCancel">Cancel</button>
    </div>
  </div>
  <div id="toast" hidden></div>

  <div id="replyBar" hidden><span id="replyText"></span><button id="replyX">✕</button></div>

  <div id="callUI" class="overlay" hidden>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="callTop"><div class="bigAv" id="callAv"></div><div id="callName"></div><div id="callInfo"></div></div>
    <div class="callBtns"><button id="muteBtn">🎤</button><button id="camToggle">📷</button><button id="endBtn" class="red">📵</button></div>
  </div>

  <div id="incoming" class="overlay" hidden>
    <div class="callTop"><div class="bigAv ringing">📞</div><div id="incomingText"></div></div>
    <div class="callBtns"><button id="declineBtn" class="red">📵</button><button id="acceptBtn" class="green">📞</button></div>
  </div>

  <div id="splash" class="overlay"><img src="icon-192.png" alt="" style="width:84px;border-radius:20px"></div>
  <div id="fList" class="overlay" hidden><div class="ctitle" id="fTitle"></div><div id="fRows"></div><button id="fClose" class="saveBtn">Close</button></div>
  <div id="loginBox" class="overlay" hidden>
    <div class="loginCard">
      <img class="loginLogo" src="icon-192.png" alt="">
      <div class="loginTitle">Jivlag</div>
      <input type="text" id="loginEmail" placeholder="Email / username / mobile" autocomplete="username" autocapitalize="none">
      <input type="text" id="regName" placeholder="Your name" hidden>
      <input type="text" id="regUser" placeholder="Username (e.g. ravi_74)" autocapitalize="none" hidden>
      <input type="tel" id="regPhone" placeholder="Mobile number (optional)" hidden>
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Log in</button>
      <button id="forgotBtn" class="lnk">Forgot password?</button>
      <button id="toggleReg" class="lnk">New here? Register (one time only)</button>
      <div id="loginErr"></div>
    </div>
  </div>

  <script type="module" src="script.js?v=68311"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
